plugins {
    id 'com.android.application'
}

// Firma estable: cuatro variables de entorno leídas en el ejecutor. Nunca en Git.
def storePath = System.getenv('ACTAREC_STORE_FILE')
def storePass = System.getenv('ACTAREC_STORE_PASSWORD')
def aliasValue = System.getenv('ACTAREC_KEY_ALIAS')
def keyPass = System.getenv('ACTAREC_KEY_PASSWORD')
def canSign = [storePath,storePass,aliasValue,keyPass].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'es.actarec.app'
    compileSdk 35

    defaultConfig {
        applicationId 'es.actarec.app'
        minSdk 29
        targetSdk 35
        versionCode Integer.parseInt((project.findProperty('actarecVersionCode') ?: '1000001').toString())
        versionName (project.findProperty('actarecVersionName') ?: '1.0.0').toString()
    }

    signingConfigs {
        if (canSign) {
            production {
                storeFile = file(storePath)
                storePassword = storePass
                keyAlias = aliasValue
                keyPassword = keyPass
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-debug'
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            if (canSign) signingConfig = signingConfigs.production
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
