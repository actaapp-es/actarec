name: Compilar y publicar Actarec

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: actarec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Verificar, compilar y distribuir
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Validar proyecto
        run: python3 scripts/check.py

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # ubuntu-24.04 ya trae Android Command-line Tools; no usar
      # android-actions/setup-android@v3 (intenta instalar el paquete 'tools').
      - name: Instalar Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root"
          manager="$(command -v sdkmanager || true)"
          if [[ -z "$manager" ]]; then
            manager="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          fi
          test -n "$manager" && test -x "$manager"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          yes | "$manager" --sdk_root="$sdk_root" --licenses > /dev/null || true
          "$manager" --sdk_root="$sdk_root" --install 'platforms;android-35' 'build-tools;35.0.0'
          test -s "$sdk_root/platforms/android-35/android.jar"
          test -x "$sdk_root/build-tools/35.0.0/aapt2"

      - name: Compilar APK
        id: apk
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ACTAREC_KEYSTORE_BASE64 }}
          SIGN_STORE_PASSWORD: ${{ secrets.ACTAREC_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.ACTAREC_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.ACTAREC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
            if (( 10#$major > 1900 || 10#$minor > 999 || 10#$patch > 999 )); then
              echo 'Tag fuera de rango (vM.m.p)' >&2; exit 1
            fi
            name="${major}.${minor}.${patch}"
            code=$((100000001 + 10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
            basename="Actarec-v${name}"
          else
            name="1.0.0-dev.${GITHUB_RUN_NUMBER}"
            code=$((1000 + GITHUB_RUN_NUMBER))
            basename="Actarec-dev"
          fi
          signed=false
          if [[ -n "${KEYSTORE_BASE64:-}" && -n "${SIGN_STORE_PASSWORD:-}" && -n "${SIGN_KEY_ALIAS:-}" && -n "${SIGN_KEY_PASSWORD:-}" ]]; then
            export ACTAREC_STORE_FILE="$RUNNER_TEMP/actarec-signing.jks"
            export ACTAREC_STORE_PASSWORD="$SIGN_STORE_PASSWORD"
            export ACTAREC_KEY_ALIAS="$SIGN_KEY_ALIAS"
            export ACTAREC_KEY_PASSWORD="$SIGN_KEY_PASSWORD"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ACTAREC_STORE_FILE"
            chmod 600 "$ACTAREC_STORE_FILE"
            trap 'rm -f "${ACTAREC_STORE_FILE:-}"' EXIT
            gradle --no-daemon --stacktrace :app:assembleRelease \
              -PactarecVersionName="$name" -PactarecVersionCode="$code"
            from="app/build/outputs/apk/release/app-release.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$from" | head -5
            signed=true
          else
            gradle --no-daemon --stacktrace :app:assembleDebug \
              -PactarecVersionName="$name" -PactarecVersionCode="$code"
            from="app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -s "$from"
          cp "$from" "dist/${basename}.apk"
          (cd dist && sha256sum "${basename}.apk" > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          echo "apk=${basename}.apk" >> "$GITHUB_OUTPUT"
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: Guardar APK descargable en Actions
        uses: actions/upload-artifact@v4
        with:
          name: Actarec-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publicar versión definitiva en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_FILENAME: ${{ steps.apk.outputs.apk }}
          APK_SIGNED: ${{ steps.apk.outputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$APK_SIGNED" != true ]]; then
            echo 'Faltan los secretos ACTAREC_* : una versión definitiva debe ir firmada.' >&2
            exit 1
          fi
          (cd dist && sha256sum -c SHA256SUMS.txt)
          # Copia con nombre fijo para que el enlace /releases/latest/download/Actarec.apk funcione siempre.
          cp "dist/$APK_FILENAME" dist/Actarec.apk
          (cd dist && sha256sum "$APK_FILENAME" Actarec.apk > SHA256SUMS.txt)
          tag="$GITHUB_REF_NAME"
          printf 'Actarec %s para Android 10 o superior. APK firmada: comprueba el SHA-256 antes de instalar.\n' "$tag" > notes.txt
          gh release create "$tag" "dist/$APK_FILENAME" dist/Actarec.apk dist/SHA256SUMS.txt --verify-tag --latest --title "Actarec $tag" --notes-file notes.txt
